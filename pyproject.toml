[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "calivox"
version = "0.1.0"
description = "Calibrated 3D image classification: cross-validated, calibrated and ensembled probabilities for volumetric scans (MRI, CT, PET, SPECT)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Milad Naeimaei Aali" }]
keywords = ["medical-imaging", "3d-classification", "calibration", "nifti", "pytorch", "ensemble"]
dependencies = [
    "torch>=2.1",
    "torchvision>=0.16",
    "monai>=1.3",
    "nibabel>=5.0",
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "pyyaml>=6.0",
    "pydantic>=2.5",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
calivox = "calivox.cli:main"

[project.urls]
Repository = "https://github.com/mnaeimaei/calivox"

[tool.setuptools.packages.find]
include = ["calivox*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning", "ignore::FutureWarning"]
